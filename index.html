var $=function(s){return document.querySelector(s)},T={},PR={},S={},O={},lastN=-1,cur=null,sb=null,TOK="",busy=false,B={},BT={},BB={},keep=null,saved=false,H=[],curP=false,HB={},HBB={},NS={};
(window.GX_CATALOG||[]).forEach(function(d){T[d.id]=d.t;PR[d.id]=d.p});

 O={};r.data.forEach(function(o){O[o.id]=o});

  stats(P);$("#out").innerHTML='<div class="panel" id="pl"><div class="pt">'+"<svg viewBox=\"0 0 24 24\"><path d=\"M6 17V11a6 6 0 0 1 12 0v6l1.5 2h-15z\"/><path d=\"M10 21h4\"/></svg>"+'<h2>สลิปรอตรวจ</h2><span class="cnt '+(P.length?"":"z")+'">'+P.length+'</span></div>'+(P.map(card).join("")||'<div class="empty"><div class="th ic ok">'+IC_OK+'</div><b>ไม่มีสลิปรอตรวจ</b>เมื่อมีลูกค้าส่งสลิปใหม่ จะขึ้นที่นี่พร้อมเสียงแจ้งเตือน</div>')+'</div>';

var DB=null;
function idb(){return new Promise(function(ok,no){try{var q=indexedDB.open("gx_slips",1);q.onupgradeneeded=function(){q.result.createObjectStore("s",{keyPath:"id"})};q.onsuccess=function(){ok(q.result)};q.onerror=function(){no()}}catch(x){no()}})}
function idbPut(id,b){return idb().then(function(d){return new Promise(function(ok,no){var t=d.transaction("s","readwrite");t.objectStore("s").put({id:id,blob:b,t:Date.now()});t.oncomplete=function(){ok(true)};t.onerror=function(){no()}})}).catch(function(){return false})}
function idbAll(){return idb().then(function(d){return new Promise(function(ok){var r=d.transaction("s").objectStore("s").getAll();r.onsuccess=function(){ok(r.result||[])};r.onerror=function(){ok([])}})}).catch(function(){return[]})}
