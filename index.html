<title>แอดมิน – ตรวจสลิป</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2fb;--card:#fff;--ink:#2a1a4a;--mute:#7f7799;--blue:#5a2fa0;--mint:#d5f2ee;--teal:#1f7f86;--ok:#238a65;--okbg:#ddf1e9;--warn:#c9741a;--warnbg:#fff0dc;--bad:#d64557;--line:#ece7f4;--sh:0 10px 30px rgba(70,40,130,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;text-size-adjust:100%}
input,select,textarea{font-size:16px!important}
html{background:var(--bg)}
body{margin:0;font:400 15px/1.5 Prompt,"Noto Sans Thai",system-ui,sans-serif;color:var(--ink);background:linear-gradient(#ece6f7,#f8f6fc 420px,var(--bg));min-height:100vh;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:calc(128px + env(safe-area-inset-bottom));max-width:620px;margin:auto}
h1,h2{margin:0;font-weight:600}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0}
svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.s{color:var(--mute);font-size:13px}
.bar{display:flex;align-items:center;gap:12px;padding:8px 2px 16px}
.logo{width:50px;height:50px;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:#fff;box-shadow:var(--sh);font:700 16px Prompt,sans-serif;color:var(--blue)}
.bar .t{flex:1;min-width:0}.bar h1{font-size:22px;line-height:1.25}
.live{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}.live i{width:7px;height:7px;border-radius:50%;background:#3cc08f;animation:lv 2.4s infinite}
@keyframes lv{70%{box-shadow:0 0 0 7px rgba(60,192,143,0)}0%{box-shadow:0 0 0 0 rgba(60,192,143,.6)}}
.ib{width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;color:var(--ink)}.ib svg{width:22px;height:22px}
.ib.tx{width:auto;border-radius:99px;padding:0 16px;display:flex;gap:6px;align-items:center;font-weight:500;font-size:14px}.ib.tx svg{width:18px;height:18px}
.note{background:#ffe9ec;border:1px solid #f6c3ca;color:#a8283b;border-radius:16px;padding:10px 14px;margin:0 0 14px;font-size:13.5px}.note:empty{display:none}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 22px 20px;color:#fff;background:radial-gradient(circle at 88% 0,rgba(255,255,255,.2),transparent 48%),linear-gradient(135deg,#3a1b6e,#5a2fa0 58%,#7b4cc9);box-shadow:0 18px 38px rgba(70,40,130,.36)}
.hero::after{content:"";position:absolute;right:-70px;bottom:-90px;width:210px;height:210px;border-radius:50%;border:1px solid rgba(255,255,255,.16);box-shadow:0 0 0 34px rgba(255,255,255,.04),0 0 0 68px rgba(255,255,255,.03);pointer-events:none}
.hero .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:rgba(255,255,255,.85)}
.chipg{width:40px;height:30px;border-radius:8px;background:linear-gradient(135deg,#f6e3b0,#c79a45);box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.hv{font:600 42px/1.15 Prompt,sans-serif;margin-top:14px;letter-spacing:.3px}.hv small{font-size:20px;font-weight:500;margin-right:4px;opacity:.85}
.hl{font-size:14.5px;color:rgba(255,255,255,.8);margin-top:2px}
.hr2{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;position:relative;z-index:1;flex-wrap:wrap}
.hp{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:9px 16px;font-weight:500;font-size:14.5px}.hp i{width:9px;height:9px;border-radius:50%;background:#7be0b4}.hp.al i{background:#ffb347;box-shadow:0 0 0 4px rgba(255,179,71,.28)}
.hbtn{display:flex;align-items:center;gap:8px;background:#fff;color:#4a2590;border-radius:99px;padding:11px 18px;font-weight:600;font-size:15px}.hbtn svg{width:19px;height:19px}
.panel{background:var(--card);border-radius:28px;padding:18px 18px 8px;margin-top:18px;box-shadow:var(--sh)}
.pt{display:flex;align-items:center;gap:10px;margin-bottom:6px}.pt svg{width:22px;height:22px;color:var(--blue)}.pt h2{font-size:19px;flex:1}
.cnt{font:600 14px Prompt,sans-serif;color:#fff;background:var(--bad);border-radius:99px;padding:0 11px;min-width:26px;text-align:center}.cnt.z{background:#c9bfdc}
.c{display:flex;gap:13px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer}.c:last-child{border-bottom:0}.c:active{opacity:.7}
.th{width:60px;height:76px;flex:none;border-radius:16px;overflow:hidden;background:#ece6f6;display:grid;place-items:center}.th img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
