<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-v3.png"><link rel="icon" href="favicon.ico" sizes="any"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0b0d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="ตรวจสลิป"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>แอดมิน – ตรวจสลิป</title>
<style>body{font:16px system-ui,sans-serif;background:#0b0b0d;color:#eee;margin:0;padding:16px;padding-top:max(16px,env(safe-area-inset-top));padding-bottom:max(16px,env(safe-area-inset-bottom));max-width:980px;margin:auto}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #333;background:#1a1a1f;color:#eee;width:100%;box-sizing:border-box;margin:6px 0}
button{background:#e63946;border:0;font-weight:700;cursor:pointer}button.g{background:#2a2a30}
h2{margin:6px 0}h3{margin:22px 0 8px}.s{color:#9a9aa5;font-size:13px}.top{display:flex;gap:8px;align-items:center}.top button{width:auto;padding:8px 16px;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.c{background:#16161b;border:1px solid #2a2a30;border-radius:12px;overflow:hidden;cursor:pointer}.c:hover{border-color:#e63946}
.c img,.c .ph{width:100%;height:190px;object-fit:cover;background:#000;display:block}.c .ph{display:grid;place-items:center;color:#777;font-size:13px}
.cb{padding:10px}.cb b{font-size:18px}.cb div{margin-top:2px;word-break:break-word}.c.paid{border-color:#2d6a4f}
.new{display:inline-block;background:#e63946;color:#fff;font-size:11px;border-radius:99px;padding:1px 8px;margin-left:6px}
#mod{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;padding:12px;z-index:9}#mod.open{display:flex}
.mb{background:#16161b;border:1px solid #2a2a30;border-radius:16px;width:min(560px,100%);max-height:100%;overflow:auto;padding:14px}
.mb img{width:100%;max-height:60vh;object-fit:contain;background:#000;border-radius:10px}.row{display:flex;gap:8px}.warn{color:#ffb4ad}
</style></head><body>
<div class="top"><h2 style="flex:1">ตรวจสลิป / ยืนยันเงินเข้า</h2><button class="g" id="rf">รีเฟรช</button></div>
<div id="app"><div id="out"></div></div><div id="m" class="s warn"></div>
<div id="mod"><div class="mb"><div id="mc"></div></div></div>
<script src="js/supabase-config.js"></script><script src="js/catalog-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
var $=function(s){return document.querySelector(s)},T={},PR={},S={},O={},lastN=-1,cur=null,sb=null,TOK="",busy=false,B={},BT={},BB={},keep=null,saved=false;
(window.GX_CATALOG||[]).forEach(function(d){T[d.id]=d.t;PR[d.id]=d.p});
function e(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function msg(t){$("#m").textContent=t||""}
/* ลิงก์ลับ: admin.html#รหัสลับ  เปิดครั้งแรกแล้วเครื่องนี้จะจำไว้ */
try{var hh=decodeURIComponent(location.hash.slice(1)).trim();if(hh){localStorage.setItem("gx_admin",hh);history.replaceState(null,"",location.pathname+location.search)}TOK=localStorage.getItem("gx_admin")||""}catch(x){}
if(!window.GX_SB||GX_SB.url.indexOf("YOUR-PROJECT")>=0){msg("ยังไม่ได้ตั้งค่า Supabase: ใส่ Project URL และ anon key ในไฟล์ js/supabase-config.js ตาม SETUP-TH.md แล้วเปิดผ่านเว็บที่อัปโหลดขึ้นโฮสต์")}
else if(!TOK){askTok("")}
else{sb=supabase.createClient(GX_SB.url,GX_SB.key,{auth:{persistSession:false,autoRefreshToken:false}})}
/* ไม่มีรหัสลับ/รหัสผิด: แสดงช่องให้กรอกรหัสเอง (เครื่องนี้จะจำไว้) */
function askTok(note){sb=null;$("#out").innerHTML='<div style="max-width:420px;margin:24px 0"><div class="s" style="margin-bottom:6px">กรอกรหัสลับแอดมิน (ดูในไฟล์ supabase-setup.sql บรรทัดที่ 2)</div><input id="tk" type="password" autocomplete="off" placeholder="รหัสลับ" autofocus><button id="tkb">เข้าสู่หน้าแอดมิน</button></div>';msg(note);
 function go(){var v=$("#tk").value.trim();if(!v)return;try{localStorage.setItem("gx_admin",v)}catch(x){}location.reload()}
 $("#tkb").onclick=go;$("#tk").onkeydown=function(ev){if(ev.key==="Enter")go()}}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.25)}catch(x){}}
function fetchSlips(list){var need=list.filter(function(o){return o.has_slip&&!S[o.id]}).slice(0,12);
 return Promise.all(need.map(function(o){return sb.rpc("admin_slip",{t:TOK,oid:o.id}).then(function(r){if(r.data){S[o.id]=r.data;prefetch(o.id,r.data)}})}))}
function prefetch(id,u){if(B[id])return;fetch(u).then(function(x){if(!x.ok)throw 0;return x.blob()}).then(function(b){B[id]=URL.createObjectURL(b);BB[id]=b;BT[id]=b.type||"image/jpeg"}).catch(function(){})}
function card(o){var u=S[o.id],pr=PR[o.file_id];
 return'<div class="c '+(o.status==="paid"?"paid":"")+'" data-id="'+o.id+'">'+(u?'<img src="'+e(u)+'" alt="สลิป" loading="lazy">':'<div class="ph">'+(o.has_slip?"กำลังโหลดสลิป …":(o.status==="paid"?"ลบสลิปแล้ว":"ไม่มีรูปสลิป"))+'</div>')
 +'<div class="cb"><b>฿'+(pr!=null?pr:Number(o.amount))+'</b><div>'+e(T[o.file_id]||o.file_id)+'</div><div class="s">'+new Date(o.created_at).toLocaleString("th-TH")+'</div></div></div>'}
function load(){if(!sb||busy)return;busy=true;sb.rpc("admin_list",{t:TOK}).then(function(r){
 if(r.error){busy=false;if(/unauthorized/i.test(r.error.message)){try{localStorage.removeItem("gx_admin")}catch(x){}askTok("รหัสลับไม่ถูกต้อง: กรอกใหม่อีกครั้ง");return}msg("โหลดไม่ได้: "+r.error.message+" (ถ้าเพิ่งตั้งค่า ให้รัน supabase-setup.sql ใหม่ทั้งไฟล์)");return}msg("");
 O={};r.data.forEach(function(o){O[o.id]=o});
 var P=r.data.filter(function(o){return o.status==="pending"}),D=r.data.filter(function(o){return o.status==="paid"}).slice(0,24);
 if(lastN>=0&&P.length>lastN)beep();lastN=P.length;document.title=(P.length?"("+P.length+") ":"")+"แอดมิน – ตรวจสลิป";
 fetchSlips(P.concat(D)).then(function(){busy=false;
  $("#out").innerHTML='<h3>รอตรวจสลิป ('+P.length+')</h3><div class="grid">'+(P.map(card).join("")||'<div class="s">ไม่มีสลิปรอตรวจ</div>')+'</div><h3>ยืนยันแล้วล่าสุด</h3><div class="grid">'+(D.map(card).join("")||'<div class="s">ยังไม่มี</div>')+'</div>';
  if(cur&&cur!==keep){if(!O[cur]||O[cur].status!=="pending")closeMod()}}).catch(function(){busy=false})})}
function openMod(id){var o=O[id];if(!o)return;cur=id;var u=S[o.id],pr=PR[o.file_id],bad=pr!=null&&Number(o.amount)!==pr;
 $("#mc").innerHTML=(u?'<img src="'+e(u)+'" alt="สลิป">':'<div class="s">ไม่มีรูปสลิป</div>')
 +'<h3 style="margin:10px 0 2px">฿'+(pr!=null?pr:Number(o.amount))+' – '+e(T[o.file_id]||o.file_id)+'</h3><div class="s">อ้างอิง '+o.id.slice(0,6).toUpperCase()+' • '+new Date(o.created_at).toLocaleString("th-TH")+'</div>'
 +(bad?'<div class="s warn">ยอดที่ลูกค้าส่งมา '+Number(o.amount).toFixed(2)+' ไม่ตรงราคาไฟล์ ตรวจให้ดี</div>':'')
 +(o.status==="pending"?'<div class="row"><button data-id="'+o.id+'" data-s="paid">ยืนยันเงินเข้า</button><button class="g" data-id="'+o.id+'" data-s="cancelled">สลิปไม่ผ่าน</button></div>':'<div class="s">ยืนยันแล้ว (สลิปถูกลบออกจากระบบแล้ว)</div>')
 +(u?'<button class="g" id="dl">บันทึกสลิปลงเครื่อง</button>':'')+'<button class="g" id="cl">ปิด</button>';$("#mod").classList.add("open")}
function isIOS(){return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1)}
function dl(id){try{var o=O[id],u=B[id];if(!o||!u)return false;var ext=(BT[id]||"image/jpeg").indexOf("png")>=0?"png":"jpg",name="slip-"+o.id.slice(0,6).toUpperCase()+"-"+o.file_id+"."+ext;
 if(isIOS()&&BB[id]&&navigator.canShare&&window.File){var f=new File([BB[id]],name,{type:BT[id]||"image/jpeg"});if(navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(){});return true}}
 var a=document.createElement("a");a.href=u;a.download=name;a.style.display="none";document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000);return true}catch(x){return false}}
function doneMod(id){var u=B[id];keep=id;saved=false;cur=id;
 $("#mc").innerHTML='<div class="s" style="color:#95d5b2;font-weight:700;margin-bottom:8px">ยืนยันเงินเข้าเรียบร้อยแล้ว</div><img src="'+e(u)+'" alt="สลิป"><div class="s warn" style="margin:8px 0">สลิปถูกลบออกจากระบบแล้ว กด “บันทึกสลิปลงเครื่อง” ก่อนปิด</div><button class="g" id="dl">บันทึกสลิปลงเครื่อง</button><button class="g" id="cl">ปิด</button>';$("#mod").classList.add("open")}
function closeMod(){if(keep&&!saved&&!confirm("ยังไม่ได้บันทึกสลิปลงเครื่อง สลิปจะหายถาวร ต้องการปิดเลยไหม?"))return;if(keep){var bu=B[keep];delete B[keep];delete BB[keep];if(bu)URL.revokeObjectURL(bu);keep=null}cur=null;$("#mod").classList.remove("open")}
$("#out").onclick=function(ev){var c=ev.target.closest(".c");if(c)openMod(c.dataset.id)};
$("#mod").onclick=function(ev){if(ev.target.id==="mod"||ev.target.id==="cl")return closeMod();
 if(ev.target.id==="dl"){if(cur&&dl(cur)){if(cur===keep)saved=true}else msg("สลิปยังโหลดไม่เสร็จ ลองใหม่อีกครั้ง");return}
 var b=ev.target.closest("button[data-id]");if(!b||!sb)return;
 if(b.dataset.s==="paid"&&!confirm("ตรวจสลิปแล้วว่าถูกต้อง ยอดตรง และเงินเข้าบัญชีจริง?"))return;
 var id=b.dataset.id,isPaid=b.dataset.s==="paid";if(isPaid&&!B[id]&&O[id]&&O[id].has_slip&&!confirm("สลิปยังโหลดไม่เสร็จ ถ้ากดยืนยันตอนนี้จะบันทึกสลิปลงเครื่องไม่ได้ ต้องการยืนยันต่อไหม?"))return;
  sb.rpc("admin_set",{t:TOK,oid:id,s:b.dataset.s}).then(function(r){if(r.error)msg("แก้ไม่ได้: "+r.error.message);else{if(isPaid){delete S[id];if(B[id])doneMod(id);else closeMod()}else closeMod()}load()})};
$("#rf").onclick=load;
if(sb){load();setInterval(load,5000)}
</script></body></html>
